<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes & Resources — Laravel Mastery Tracker</title>
<script>try{var s=JSON.parse(localStorage.getItem('lmt_data_v1')||'{}');document.documentElement.setAttribute('data-bs-theme',(s.settings&&s.settings.theme)||'dark')}catch(e){}</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body data-page="notes" data-title="Notes & Resources" data-subtitle="Learning notes, code snippets, documentation links and bookmarks">
<a class="skip-link" href="#main">Skip to content</a>
<aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="main-wrap">
  <header class="topbar" id="topbar"></header>
  <main id="main" class="content" tabindex="-1">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
      <div><h2 class="page-title">Knowledge base</h2><p class="small text-muted-lmt mb-0" id="noteSummary"></p></div>
      <div class="d-flex gap-2"><button class="btn btn-outline-lmt btn-sm" id="btnExportNotes"><i class="bi bi-filetype-json"></i> Export notes</button><button class="btn btn-primary btn-sm" id="btnNewNote"><i class="bi bi-plus-lg"></i> New note</button></div>
    </div>
    <div class="card-lmt card-pad mb-3" role="search"><div class="row g-2 align-items-end">
      <div class="col-md-4"><label class="form-label" for="nSearch">Search</label><input type="search" class="form-control form-control-sm" id="nSearch" placeholder="Search title, content, tags"></div>
      <div class="col-6 col-md-2"><label class="form-label" for="nType">Type</label><select class="form-select form-select-sm" id="nType"><option value="">All types</option><option value="note">Note</option><option value="snippet">Code snippet</option><option value="doc">Documentation link</option><option value="bookmark">Bookmark</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" for="nTopic">Topic</label><select class="form-select form-select-sm" id="nTopic"></select></div>
      <div class="col-6 col-md-2"><label class="form-label" for="nProject">Project</label><select class="form-select form-select-sm" id="nProject"></select></div>
      <div class="col-6 col-md-2"><label class="form-label" for="nTag">Tag</label><select class="form-select form-select-sm" id="nTag"></select></div>
    </div></div>
    <div id="noteGrid"></div>
  </main>
</div>

<div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="nmTitle" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable"><form class="modal-content" id="noteForm" novalidate>
    <div class="modal-header"><h2 class="modal-title h5" id="nmTitle">Note</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><input type="hidden" id="noteId">
      <div class="row g-3">
        <div class="col-md-8"><label class="form-label" for="noteTitle">Title *</label><input class="form-control" id="noteTitle" required maxlength="160"><div class="invalid-feedback">Title is required.</div></div>
        <div class="col-md-4"><label class="form-label" for="noteType">Type</label><select class="form-select" id="noteType"><option value="note">Note</option><option value="snippet">Code snippet</option><option value="doc">Documentation link</option><option value="bookmark">Bookmark</option></select></div>
        <div class="col-md-6"><label class="form-label" for="noteTopicSel">Roadmap topic</label><select class="form-select" id="noteTopicSel"></select></div>
        <div class="col-md-6"><label class="form-label" for="noteProjectSel">Project</label><select class="form-select" id="noteProjectSel"></select></div>
        <div class="col-md-8"><label class="form-label" for="noteUrl">Link URL <span class="fw-normal text-muted-lmt">(required for bookmarks & docs)</span></label><input type="url" class="form-control" id="noteUrl" data-url placeholder="https://laravel.com/docs/..."><div class="invalid-feedback">Enter a valid http(s):// URL.</div></div>
        <div class="col-md-4"><label class="form-label" for="noteTags">Tags <span class="fw-normal text-muted-lmt">(comma separated)</span></label><input class="form-control" id="noteTags" placeholder="eloquent, performance"></div>
        <div class="col-lg-6"><label class="form-label" for="noteBody">Content <span class="fw-normal text-muted-lmt">(Markdown-like: # heading, **bold**, *italic*, `code`, - lists, ```code blocks```)</span></label><textarea class="form-control font-monospace" id="noteBody" rows="12" style="font-size:.85rem"></textarea></div>
        <div class="col-lg-6"><span class="form-label d-block">Live preview <span class="fw-normal text-muted-lmt">(HTML is never executed)</span></span><div class="card-lmt card-pad note-body" id="notePreview" style="min-height:260px;max-height:340px;overflow:auto" aria-live="polite"></div></div>
        <div class="col-md-3"><label class="form-label" for="snippetLang">Snippet language</label><input class="form-control" id="snippetLang" placeholder="php" maxlength="20"></div>
        <div class="col-md-9"><label class="form-label" for="snippetCode">Code snippet <span class="fw-normal text-muted-lmt">(optional)</span></label><textarea class="form-control font-monospace" id="snippetCode" rows="5" style="font-size:.82rem" spellcheck="false"></textarea></div>
        <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="notePinned"><label class="form-check-label" for="notePinned">Pin this note</label></div></div>
      </div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-lmt" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save note</button></div>
  </form></div>
</div>

<div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="vmTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5" id="vmTitle">Note</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body" id="vmBody"></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-lmt" id="vmEdit"><i class="bi bi-pencil"></i> Edit</button><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const L = LMT, $ = id => document.getElementById(id), esc = L.esc;
  const formModal = new bootstrap.Modal($('noteModal')), viewModal = new bootstrap.Modal($('viewModal'));
  const TYPES = { note: ['Note', 'bi-journal-text'], snippet: ['Snippet', 'bi-code-slash'], doc: ['Docs', 'bi-book'], bookmark: ['Bookmark', 'bi-bookmark-star'] };
  let viewing = null;
  const allTags = () => [...new Set(L.state.notes.flatMap(n => n.tags || []))].sort();
  function fillFilters() {
    const keep = (id, html) => { const v = $(id).value; $(id).innerHTML = html; if ([...$(id).options].some(o => o.value === v)) $(id).value = v; };
    keep('nTopic', L.topicOptions([], { empty: 'All topics' }));
    keep('nProject', L.projectOptions('', { empty: 'All projects' }));
    keep('nTag', '<option value="">All tags</option>' + allTags().map(t => `<option value="${esc(t)}">#${esc(t)}</option>`).join(''));
  }
  function fullBody(n) { return L.md(n.body) + (n.code ? `<pre class="code-block" tabindex="0"><span class="code-lang">${esc(n.lang || 'code')}</span><code>${esc(n.code)}</code></pre>` : ''); }
  function render() {
    fillFilters();
    const q = $('nSearch').value.trim().toLowerCase(), ty = $('nType').value, tp = $('nTopic').value, pj = $('nProject').value, tg = $('nTag').value;
    const list = L.state.notes.filter(n => (!q || `${n.title} ${n.body} ${n.code || ''} ${(n.tags || []).join(' ')}`.toLowerCase().includes(q)) && (!ty || n.type === ty) && (!tp || n.topicId === tp) && (!pj || n.projectId === pj) && (!tg || (n.tags || []).includes(tg)))
      .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    $('noteSummary').textContent = `${L.state.notes.length} item(s) · ${L.state.notes.filter(n => n.type === 'bookmark' || n.type === 'doc').length} links · ${allTags().length} tags`;
    $('noteGrid').innerHTML = list.length ? `<div class="row g-3">${list.map(n => {
      const t = n.topicId ? L.topic(n.topicId) : null, p = n.projectId ? L.project(n.projectId) : null, ty = TYPES[n.type] || TYPES.note;
      return `<div class="col-md-6 col-xxl-4"><article class="card-lmt note-card fade-in" data-id="${esc(n.id)}"><div class="card-pad d-flex flex-column flex-grow-1">
        <div class="d-flex align-items-start gap-2 mb-2"><span class="kpi-icon" style="width:34px;height:34px;font-size:1rem"><i class="bi ${ty[1]}"></i></span><div class="min-w-0 flex-grow-1"><h3 class="h6 fw-bold mb-0 text-truncate"><button class="topic-title" data-act="view">${esc(n.title)}</button></h3><div class="kpi-hint">${ty[0]} · updated ${L.timeAgo(n.updatedAt)}</div></div>${n.pinned ? '<i class="bi bi-pin-angle-fill text-accent" aria-label="Pinned"></i>' : ''}</div>
        ${n.url ? `<div class="mb-2">${L.link(n.url, n.type === 'doc' ? 'Open documentation' : 'Open link')}</div>` : ''}
        <div class="note-body note-preview small mb-2">${fullBody(n) || '<span class="text-muted-lmt">No content.</span>'}</div>
        <div class="d-flex flex-wrap gap-1 mt-auto pt-2">${t ? `<a class="chip" href="roadmap.html?topic=${encodeURIComponent(t.id)}"><i class="bi bi-signpost-split"></i> ${esc(t.id)}</a>` : ''}${p ? `<a class="chip" href="projects.html?project=${encodeURIComponent(p.id)}"><i class="bi bi-kanban"></i> ${esc(p.name)}</a>` : ''}${(n.tags || []).map(x => `<button class="chip" data-tag="${esc(x)}">#${esc(x)}</button>`).join('')}</div>
        <div class="d-flex gap-1 justify-content-end mt-2"><button class="btn-ghost" data-act="edit" aria-label="Edit ${esc(n.title)}"><i class="bi bi-pencil"></i></button><button class="btn-ghost danger" data-act="delete" aria-label="Delete ${esc(n.title)}"><i class="bi bi-trash"></i></button></div>
      </div></article></div>`; }).join('')}</div>`
      : `<div class="card-lmt">${L.emptyState('bi-sticky', L.state.notes.length ? 'No notes match your filters' : 'No notes yet', L.state.notes.length ? 'Try clearing filters.' : 'Capture what you learn, save snippets and bookmark great docs.', '<button class="btn btn-sm btn-primary" data-act="new">Create note</button>')}</div>`;
  }
  function open(n = null) {
    const f = $('noteForm'); f.reset(); f.classList.remove('was-validated'); $('noteUrl').setCustomValidity('');
    $('nmTitle').textContent = n ? 'Edit note' : 'New note';
    $('noteId').value = n ? n.id : '';
    $('noteTitle').value = n ? n.title : ''; $('noteType').value = n ? n.type : 'note';
    $('noteTopicSel').innerHTML = L.topicOptions(n ? n.topicId : ($('nTopic').value || ''), { empty: 'None' });
    $('noteProjectSel').innerHTML = L.projectOptions(n ? n.projectId : ($('nProject').value || ''), { empty: 'None' });
    $('noteUrl').value = n ? n.url || '' : ''; $('noteTags').value = n ? (n.tags || []).join(', ') : '';
    $('noteBody').value = n ? n.body || '' : ''; $('snippetLang').value = n ? n.lang || '' : ''; $('snippetCode').value = n ? n.code || '' : '';
    $('notePinned').checked = !!(n && n.pinned);
    preview(); formModal.show();
  }
  const preview = () => { $('notePreview').innerHTML = L.md($('noteBody').value) || '<span class="text-muted-lmt small">Preview appears here.</span>'; };
  $('noteBody').addEventListener('input', L.debounce(preview, 150));
  $('noteForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target; $('noteTitle').value = $('noteTitle').value.trim();
    L.validateUrlInputs(f);
    const ty = $('noteType').value;
    if ((ty === 'bookmark' || ty === 'doc') && !$('noteUrl').value.trim()) $('noteUrl').setCustomValidity('URL required');
    f.classList.add('was-validated');
    if (!f.checkValidity()) { L.toast('Please fix the highlighted fields.', 'danger'); return; }
    const id = $('noteId').value, ts = new Date().toISOString();
    const data = { title: $('noteTitle').value, type: ty, topicId: $('noteTopicSel').value, projectId: $('noteProjectSel').value, url: $('noteUrl').value.trim(),
      tags: [...new Set($('noteTags').value.split(',').map(t => t.trim().toLowerCase().replace(/^#/, '')).filter(Boolean))], body: $('noteBody').value,
      lang: $('snippetLang').value.trim(), code: $('snippetCode').value.replace(/\s+$/, ''), pinned: $('notePinned').checked, updatedAt: ts };
    if (id) Object.assign(L.state.notes.find(n => n.id === id), data);
    else L.state.notes.push(Object.assign({ id: L.uid('note'), createdAt: ts }, data));
    L.log('note', `${id ? 'Updated' : 'Created'} ${TYPES[ty][0].toLowerCase()} "${data.title}"`);
    L.save(); formModal.hide(); L.toast('Note saved.');
  });
  function view(n) {
    viewing = n.id;
    $('vmTitle').textContent = n.title;
    const t = n.topicId ? L.topic(n.topicId) : null, p = n.projectId ? L.project(n.projectId) : null;
    $('vmBody').innerHTML = `<div class="d-flex flex-wrap gap-1 mb-3"><span class="badge-lmt st-ip">${TYPES[n.type][0]}</span>${t ? `<a class="chip" href="roadmap.html?topic=${encodeURIComponent(t.id)}">${esc(t.id)} · ${esc(t.title)}</a>` : ''}${p ? `<a class="chip" href="projects.html?project=${encodeURIComponent(p.id)}">${esc(p.name)}</a>` : ''}${(n.tags || []).map(x => `<span class="chip">#${esc(x)}</span>`).join('')}</div>
      ${n.url ? `<div class="mb-3">${L.link(n.url, n.url.length > 60 ? n.url.slice(0, 60) + '…' : n.url)}</div>` : ''}<div class="note-body">${fullBody(n) || '<p class="text-muted-lmt">No content.</p>'}</div>
      <div class="kpi-hint mt-3">Created ${L.fmtTs(n.createdAt)} · Updated ${L.fmtTs(n.updatedAt)}</div>`;
    viewModal.show();
  }
  $('vmEdit').addEventListener('click', () => { const n = L.state.notes.find(x => x.id === viewing); viewModal.hide(); if (n) open(n); });
  $('noteGrid').addEventListener('click', async e => {
    const tag = e.target.closest('[data-tag]'); if (tag) { $('nTag').value = tag.dataset.tag; render(); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'new') return open();
    const n = L.state.notes.find(x => x.id === b.closest('[data-id]').dataset.id); if (!n) return;
    if (b.dataset.act === 'view') view(n);
    else if (b.dataset.act === 'edit') open(n);
    else if (b.dataset.act === 'delete' && await L.confirm(`Delete "${n.title}"?`, { title: 'Delete note', ok: 'Delete', danger: true })) {
      L.state.notes = L.state.notes.filter(x => x.id !== n.id); L.log('note', `Deleted note "${n.title}"`); L.save(); L.toast('Note deleted.');
    }
  });
  $('btnNewNote').addEventListener('click', () => open());
  $('btnExportNotes').addEventListener('click', () => {
    if (!L.state.notes.length) { L.toast('There are no notes to export.', 'warning'); return; }
    L.download(`lmt-notes-${L.today()}.json`, JSON.stringify({ app: 'Laravel Mastery Tracker', type: 'notes', exportedAt: new Date().toISOString(), notes: L.state.notes }, null, 2));
    L.toast('Notes exported. (Full backups in Settings include notes too.)');
  });
  $('nSearch').addEventListener('input', L.debounce(render, 200));
  ['nType', 'nTopic', 'nProject', 'nTag'].forEach(i => $(i).addEventListener('change', render));
  fillFilters();
  const qt = L.param('topic'), qp = L.param('project');
  if (qt) $('nTopic').value = qt; if (qp) $('nProject').value = qp;
  L.onChange(render);
  render();
})();
</script>
</body>
</html>
